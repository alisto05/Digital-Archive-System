# ---- MySQL (all three come from environment variables; the app will not start without DB_URL) ----
# Example: DB_URL=jdbc:mysql://localhost:3306/syncpoint?serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- First administrator (created on startup if it does not exist yet) ----
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# ---- PDF storage ----
hospitalarchive.storage.location=${STORAGE_DIR:./storage}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---- Session cookie ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set COOKIE_SECURE=true once the API is served over HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Login is done by hand (AuthController), so Spring Boot's generated in-memory user is not wanted
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
