services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: syncpoint_archive
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
#Every sq; file in ./db runs once, in name order
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
    db:
      condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://db:3306/syncpoint_archive?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      #intial admin, created on startup if it does not exist
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      #PDF storage folder
      STORAGE_DIR: /app/storage
    volumes:
      - archive_storage:/app/storage
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./Frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SYNCPOINT_API_URL: http://backend:8080
    ports:
      - "8501:8501"

volumes:
  db_data:
  archive_storage: